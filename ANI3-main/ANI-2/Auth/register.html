<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ani — Register</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page register-page" data-page="auth">
    <main class="auth-scene register-scene">
        <section class="auth-panel register-panel" aria-labelledby="register-title">
            <h1 id="register-title"><a href="../landing.html" class="register-title">Register Account</a></h1>
            <form id="registerForm">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" autocomplete="name" required autofocus>
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" autocomplete="tel" required>
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" required>
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" autocomplete="new-password" required>
                <button type="submit">SUBMIT</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Login here.</a></p>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="../assets/js/core.js"></script>
    <script src="auth.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aniya — Dashboard</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../Chat/chat.css">
</head>

<body data-page="dashboard">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main">
            <header class="page-header header-top-bar">
                <div>
                    <h1>Dashboard</h1>
                    <p>Here's what's happening across the rice plots today.</p>
                </div>

                <div class="side-note header-user-wrap">
                    <div id="sidebarUser" class="side-user" hidden></div>
                    <a href="#" id="logoutBtn" class="logout-link">🚪 Logout</a>
                </div>
            </header>

            <div id="dashError" class="error-box" hidden></div>

            <div class="stats">
                <div class="stat">
                    <b id="statRice">–</b>
                    <span>Rice Plots</span>
                </div>

                <div class="stat">
                    <b id="statTasks">–</b>
                    <span>Watering Tasks Due Today</span>
                </div>

                <div class="stat">
                    <b id="statHarvests">–</b>
                    <span>Harvests This Week</span>
                </div>
            </div>

            <section class="card">
                <h2>Plot Overview</h2>
                <p>
                    A quick visual of every plot — full add/edit tools live on the
                    <a href="../Plots/plots.html">Plots page</a>.
                </p>
                <div class="plot-grid" id="plotGrid"></div>
            </section>

            <div class="two-col">
                <section class="card">
                    <h2>Today's Watering Tasks</h2>
                    <div id="taskList"></div>
                </section>

                <div class="stack">
                    <section class="card">
                        <h2>Recent Harvest</h2>
                        <div id="harvestList"></div>
                    </section>

                    <section class="card">
                        <h2>Seed Inventory</h2>
                        <div id="seedList"></div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <template id="tpl-plot-card">
        <div class="plot-card">
            <strong data-field="name"></strong>
            <small data-field="crop"></small>
            <div>
                <span class="badge" data-badge="crop"></span>
                <span class="badge" data-badge="status"></span>
            </div>
        </div>
    </template>

    <template id="tpl-task-item">
        <div class="list-row">
            <span data-field="label"></span>
            <span class="badge" data-badge="state"></span>
        </div>
    </template>

    <template id="tpl-harvest-item">
        <div class="list-row">
            <span data-field="label"></span>
            <strong data-field="quantity"></strong>
        </div>
    </template>

    <template id="tpl-seed-item">
        <div class="list-row">
            <span data-field="name"></span>
            <strong>
                <span data-field="quantity"></span>
                <span class="badge low" data-role="low" hidden>Low</span>
            </strong>
        </div>
    </template>

    <template id="tpl-empty">
        <div class="empty" data-field="text"></div>
    </template>

    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="dashboard.js"></script>
    <script src="../Chat/chat.js"></script>
</body>

</html>

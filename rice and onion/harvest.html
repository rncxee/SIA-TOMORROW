<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTrack — Harvest Records</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar__brand">🌱 AniTrack</div>
        <nav class="sidebar__nav">
            <a href="index.html">📊 Dashboard</a>
            <a href="plots.html">🌾 Plots</a>
            <a href="watering.html">💧 Watering Tasks</a>
            <a href="harvest.html" class="active">🧺 Harvest Records</a>
            <a href="seeds.html">🌰 Seed Inventory</a>
        </nav>
        <p class="sidebar__note">Onion &amp; Rice plot tracking for the community garden.</p>
    </aside>

    <main class="main">

        <div class="main__header">
            <h1>Harvest Records</h1>
            <p>Log each harvest and keep a running history per plot.</p>
        </div>

        <!-- ---------- ADD HARVEST FORM ---------- -->
        <section class="panel">
            <h2>Log a Harvest</h2>
            <p id="add-harvest-message" class="form-message"></p>
            <form id="add-harvest-form" class="form-row">
                <div class="form-field">
                    <label for="plot_id">Plot</label>
                    <select id="plot_id" name="plot_id" required>
                        <option value="">Loading plots…</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="harvest_date">Date</label>
                    <input type="date" id="harvest_date" name="harvest_date" required>
                </div>
                <div class="form-field">
                    <label for="quantity_kg">Quantity (kg)</label>
                    <input type="number" step="0.01" min="0" id="quantity_kg" name="quantity_kg" placeholder="e.g. 12.5" required>
                </div>
                <div class="form-field">
                    <label for="notes">Notes (optional)</label>
                    <input type="text" id="notes" name="notes" placeholder="e.g. Good bulb size">
                </div>
                <button type="submit" class="btn btn-primary">➕ Log Harvest</button>
            </form>
        </section>

        <!-- ---------- HARVEST HISTORY ---------- -->
        <section class="panel">
            <h2>Harvest History</h2>
            <table class="data-table">
                <thead>
                    <tr><th>Date</th><th>Plot</th><th>Crop</th><th>Quantity</th><th>Notes</th></tr>
                </thead>
                <tbody id="harvest-body">
                    <tr><td colspan="5" class="empty-note">Loading harvest history…</td></tr>
                </tbody>
            </table>
        </section>

    </main>
</div>

<script src="js/harvest.js"></script>
</body>
</html>
